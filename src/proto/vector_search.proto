syntax = "proto3";
package vectorsearch;

service VectorSearch {
  rpc Search(SearchRequest)               returns (SearchResponse);
  rpc Insert(InsertRequest)               returns (InsertResponse);
  rpc Delete(DeleteRequest)               returns (DeleteResponse);
  rpc Update(UpdateRequest)               returns (UpdateResponse);
  rpc ClearCache(ClearCacheRequest)       returns (ClearCacheResponse);
  rpc NotifyBatchApplied(BatchAppliedNotification) returns (BatchAppliedAck);
}

message SearchRequest {
  repeated float vector = 1;
  int32  top_k           = 2;
  int32  n_probe         = 3;
}

message Neighbor {
  int64 id       = 1;
  float distance = 2;
}

message SearchResponse {
  repeated Neighbor results        = 1;
  float centroid_search_ms         = 2;  // time to find n_probe centroids
  float fetch_ms                   = 3;  // total MinIO fetch time
  float scan_ms                    = 4;  // brute-force L2 scan time
  int32 cache_hits                 = 5;  // centroids served from cache (out of n_probe)
}

message InsertRequest {
  repeated float vector = 1;
}

message InsertResponse {
  int64 id = 1;
}

message DeleteRequest {
  int64 id = 1;
}

message DeleteResponse {
  bool success = 1;
}

message UpdateRequest {
  int64          id         = 1;
  repeated float new_vector = 2;
}

message UpdateResponse {
  bool success = 1;
}

message ClearCacheRequest  {}
message ClearCacheResponse {}

message BatchAppliedNotification {
  int64          last_seq_id            = 1;
  repeated int32 modified_partition_ids = 2;
}

message BatchAppliedAck {}