syntax = "proto3";
package vectorsearch;

service VectorSearch {
  rpc Search(SearchRequest)               returns (SearchResponse);
  rpc Insert(InsertRequest)               returns (InsertResponse);
  rpc Delete(DeleteRequest)               returns (DeleteResponse);
  rpc Update(UpdateRequest)               returns (UpdateResponse);
  rpc ClearCache(ClearCacheRequest)       returns (ClearCacheResponse);
  rpc NotifyBatchApplied(BatchAppliedNotification) returns (BatchAppliedAck);
}

message SearchRequest {
  repeated float vector = 1;
  int32  top_k           = 2;
  int32  n_probe         = 3;
  string fetch_policy    = 4;  // "heuristic" | "learned" | "always_fetch" | "always_cache"
}

message Neighbor {
  int64 id       = 1;
  float distance = 2;
}

message SearchResponse {
  repeated Neighbor results        = 1;
  float centroid_search_ms         = 2;  // time to find n_probe centroids
  float fetch_ms                   = 3;  // total MinIO fetch time
  float scan_ms                    = 4;  // brute-force L2 scan time
  int32 cache_hits                 = 5;  // partitions served from cache (out of n_probe)
  float inference_ms               = 6;  // XGBoost inference time (learned policy only)
  int32 fetch_count                = 7;  // partitions fetched from MinIO (cold + policy)
  int64 bytes_fetched              = 8;  // raw bytes fetched from MinIO
  int32 cold_fetch_count           = 9;  // fetches because partition was not in cache
  int32 policy_fetch_count         = 10; // fetches because policy decided stale cached partition needs refresh
}

message InsertRequest {
  repeated float vector = 1;
}

message InsertResponse {
  int64 id = 1;
}

message DeleteRequest {
  int64 id = 1;
}

message DeleteResponse {
  bool success = 1;
}

message UpdateRequest {
  int64          id         = 1;
  repeated float new_vector = 2;
}

message UpdateResponse {
  bool success = 1;
}

message ClearCacheRequest  {}
message ClearCacheResponse {}

message PartitionMetadataDelta {
  int32          partition_id              = 1;
  int32          version_id               = 2;
  int32          number_of_inserts        = 3;
  int32          number_of_updates        = 4;
  int32          number_of_deletes        = 5;
  int32          partition_size           = 6;
  float          fraction_vectors_touched = 7;
  int32          membership_change_count  = 8;
  repeated float new_centroid             = 9;
  float          reconstruction_error     = 10;
}

message BatchAppliedNotification {
  int64                           last_seq_id      = 1;
  repeated PartitionMetadataDelta partition_deltas = 2;
}

message BatchAppliedAck {}